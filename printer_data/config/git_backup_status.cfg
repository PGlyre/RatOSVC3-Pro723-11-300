# === GIT BACKUP STATUS ===
# Version: 1.0
#
# Visar status för Klipper-Backup i Mainsail.
#
# GIT_STATUS:
# - visar senaste backup-commit
# - visar commits före GitHub
# - visar commits efter GitHub

# === SHELL COMMAND ===
[gcode_shell_command git_status]
command: /home/pi/git-backup-status.sh
timeout: 10.0
verbose: True

# === MACRO ===
[gcode_macro GIT_STATUS]
description: Show GitHub Backup Status
gcode:
    RUN_SHELL_COMMAND CMD=git_status

# === GIT BACKUP STATUS ===
# Version: 1.0
#
# Visar status för /home/pi/config_backup i Mainsail-konsolen.

# === SHELL COMMAND ===
[gcode_shell_command git_status]
command: /home/pi/git-backup-status.sh
timeout: 10.0
verbose: True

# === GCODE MACRO ===
[gcode_macro GIT_STATUS]
description: Show GitHub backup status
gcode:
    RUN_SHELL_COMMAND CMD=git_status

# ==================================================================================================
# === PRINTER CONFIG: Printer 1 / RatOS 2.1
# === FILE: printer.cfg
# === CLEAN VERSION: v1.0
# === DATE: 2026-05-02
# === NOTES:
# === - Cleaned and reorganized for readability.
# === - Existing active configuration values have been preserved.
# === - Old/unused example blocks have been removed from this clean file.
# === - Old speed-test module section is not included.
# ==================================================================================================

# ==================================================================================================
# === RATOS BASE CONFIG
# === RatOS.cfg must stay near the top. Everything below may override RatOS defaults.
# ==================================================================================================
[include RatOS.cfg]


# ==================================================================================================
# === USER / PGe KLIPPER MODULES
# === Active custom include files for fans, chamber control, LEDs, filament, and Spoolman.
# ==================================================================================================
[include PGe-Klipper/all_fan.cfg]
[include PGe-Klipper/Chamber_Filter.cfg]
[include PGe-Klipper/Chamber_Heater.cfg]
[include PGe-Klipper/Led_Control.cfg]
[include PGe-Klipper/SFS_V2.cfg]
[include PGe-Klipper/Spoolman.cfg]


# ==================================================================================================
# === KLIPPER / MOONRAKER SUPPORT INCLUDES
# === Shell commands and timelapse support.
# ==================================================================================================
[include shell_command.cfg]
[include timelapse.cfg]


# ==================================================================================================
# === RATOS MACRO CONFIGURATION
# === Controls the behavior of standard RatOS print macros.
# === Docs: https://os.ratrig.com/docs/configuration/macros
# ==================================================================================================
[gcode_macro RatOS]
variable_relative_extrusion: False
variable_preheat_extruder: True
variable_calibrate_bed_mesh: True
variable_nozzle_priming: "primeblob"
variable_start_print_park_in: "back"
variable_start_print_park_z_height: 50
variable_end_print_park_in: "back"
variable_pause_print_park_in: "back"


# ==================================================================================================
# === MOTION / STEPPERS
# === CoreXY motion and Z axis motors.
# ==================================================================================================

# === X Axis / A Motor - rear left CoreXY motor
[stepper_x]
dir_pin: x_dir_pin
rotation_distance: 40
homing_speed: 50
position_min: 0
position_max: 300
position_endstop: 0

# === Y Axis / B Motor - rear right CoreXY motor
[stepper_y]
dir_pin: y_dir_pin
rotation_distance: 40
homing_speed: 50
position_min: 0
position_max: 300
position_endstop: 300

# === Z Axis / Z0 Motor - left Z motor
[stepper_z]
dir_pin: !z0_dir_pin
rotation_distance: 4
homing_speed: 10
position_min: -5
position_max: 300

# === Z1 Motor - rear Z motor
[stepper_z1]
dir_pin: !z1_dir_pin
rotation_distance: 4

# === Z2 Motor - right Z motor
[stepper_z2]
dir_pin: !z2_dir_pin
rotation_distance: 4


# ==================================================================================================
# === EXTRUDER
# === Extruder direction, rotation distance, and PID tuning.
# ==================================================================================================
[extruder]
dir_pin: !e_dir_pin
rotation_distance: 5.57
control: pid
pid_kp: 28.413
pid_ki: 1.334
pid_kd: 151.300


# ==================================================================================================
# === HEATED BED
# === Bed heater PID tuning.
# ==================================================================================================
[heater_bed]
control: pid
pid_kp: 22.2
pid_ki: 1.08
pid_kd: 114


# ==================================================================================================
# === KLIPPER FEATURES
# === Console responses, object exclusion, and arc move support.
# ==================================================================================================
[respond]

[exclude_object]

[gcode_arcs]
resolution: 0.1


# ==================================================================================================
# === PROBE
# === Current active probe mode: NPN NC using pullup.
# === NOTE: z_offset is normally updated by PROBE_CALIBRATE + SAVE_CONFIG.
# ==================================================================================================
[probe]
z_offset: 0.0
pin: ^probe_pin


# ==================================================================================================
# === DISPLAY / BEEPER / DISPLAY BACKLIGHT
# === MKS Mini 12864Panel v3.x with neopixel backlight LEDs.
# ==================================================================================================
[display]
lcd_type: uc1701
cs_pin: PE9
a0_pin: PE10
rst_pin: PE12
contrast: 63
encoder_pins: ^PB2, ^PB1
click_pin: ^!PE7
spi_software_miso_pin: PA6
spi_software_mosi_pin: PA7
spi_software_sclk_pin: PA5

[output_pin beeper]
pin: PE8

[neopixel mks_mini12864]
pin: PE13
chain_count: 3
color_order: RGB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0


